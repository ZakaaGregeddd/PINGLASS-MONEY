<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>FinGlass - Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Sora:wght@600;700;900&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet"
  />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-secondary-fixed-variant": "#005047",
            "on-tertiary": "#00354a",
            "surface-container-high": "#1c2b3c",
            "on-background": "#d4e4fa",
            "secondary-container": "#03c6b2",
            "secondary-fixed-dim": "#3cddc7",
            "primary-fixed": "#dae2fd",
            "on-primary-container": "#798098",
            "on-primary-fixed": "#131b2e",
            "on-tertiary-container": "#008abb",
            outline: "#909097",
            "primary-fixed-dim": "#bec6e0",
            "surface-container-low": "#0d1c2d",
            "primary-container": "#0f172a",
            "on-surface-variant": "#c6c6cd",
            "on-primary-fixed-variant": "#3f465c",
            "surface-container-lowest": "#010f1f",
            "surface-bright": "#2c3a4c",
            secondary: "#44e2cd",
            "error-container": "#93000a",
            "on-surface": "#d4e4fa",
            "surface-container": "#122131",
            "outline-variant": "#45464d",
            "surface-dim": "#051424",
            "inverse-on-surface": "#233143",
            "inverse-surface": "#d4e4fa",
            "surface-container-highest": "#273647",
            "on-secondary-container": "#004d44",
            primary: "#bec6e0",
            "surface-tint": "#bec6e0",
            "on-error-container": "#ffdad6",
            "on-tertiary-fixed-variant": "#004c69",
            "on-secondary-fixed": "#00201c",
            "tertiary-container": "#001a27",
            "error": "#f2b8b5",
            "on-error": "#601410",
            background: "#010f1f",
            surface: "#051424",
            "on-primary": "#1d2139",
            "on-secondary": "#000000",
            tertiary: "#0084a3",
            "on-tertiary": "#ffffff",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-gradient-to-br from-primary-container via-surface to-surface-dim min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="text-4xl font-bold mb-2">
        <span class="text-secondary">💰</span> FinGlass
      </div>
      <p class="text-on-surface-variant">Personal Finance Manager</p>
    </div>

    <!-- Login Card -->
    <div class="card bg-gradient-to-br from-surface-container to-surface-container-high">
      <!-- Alert Messages -->
      <div id="alert" class="alert hidden mb-6" role="alert">
        <span class="material-symbols-outlined text-lg">info</span>
        <div id="alertMessage"></div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

        <!-- Email Input -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="your@email.com"
            required
            class="w-full px-4 py-3 bg-surface-container-high border border-outline rounded-lg text-on-surface focus:border-primary focus:outline-none"
          />
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
            class="w-full px-4 py-3 bg-surface-container-high border border-outline rounded-lg text-on-surface focus:border-primary focus:outline-none"
          />
        </div>

        <!-- Remember Me -->
        <div class="flex items-center mb-6">
          <input
            type="checkbox"
            id="remember"
            class="w-4 h-4 rounded border-outline"
          />
          <label for="remember" class="ml-2 text-sm text-on-surface-variant">
            Remember me
          </label>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          id="loginBtn"
          class="w-full bg-gradient-to-r from-primary to-secondary-container text-primary-container font-bold py-3 rounded-lg hover:shadow-lg transition-all duration-300 flex items-center justify-center gap-2"
        >
          <span class="material-symbols-outlined">login</span>
          <span>Login</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-outline-variant"></div>
        <span class="px-3 text-on-surface-variant text-sm">or</span>
        <div class="flex-1 h-px bg-outline-variant"></div>
      </div>

      <!-- Sign Up Link -->
      <div class="text-center">
        <p class="text-on-surface-variant mb-4">Don't have an account?</p>
        <a
          href="./signup.html"
          class="w-full border border-outline text-on-surface py-3 rounded-lg hover:bg-surface-container-high transition-colors flex items-center justify-center gap-2"
        >
          <span class="material-symbols-outlined">person_add</span>
          <span>Create Account</span>
        </a>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8">
      <p class="text-on-surface-variant text-sm">
        FinGlass © 2024 - Manage Your Finances Wisely
      </p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/api.js"></script>
  <script>
    // Handle Login
    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const loginBtn = document.getElementById("loginBtn");
      const alertDiv = document.getElementById("alert");
      const alertMessage = document.getElementById("alertMessage");

      // Validation
      if (!email || !password) {
        showAlert("alertMessage", "Email dan password harus diisi", "error");
        return;
      }

      if (password.length < 6) {
        showAlert("alertMessage", "Password minimal 6 karakter", "error");
        return;
      }

      // Show loading state
      loginBtn.disabled = true;
      loginBtn.innerHTML =
        '<span class="spinner"></span> <span>Logging in...</span>';

      try {
        // Call login API
        const response = await api.login(email, password);

        if (response?.session?.accessToken) {
          showAlert("alertMessage", "Login berhasil! Redirecting...", "success");

          // Redirect ke dashboard setelah 1 detik
          setTimeout(() => {
            window.location.href = "./dashboard.html";
          }, 1000);
        } else {
          showAlert("alertMessage", "Login gagal", "error");
          loginBtn.disabled = false;
          loginBtn.innerHTML =
            '<span class="material-symbols-outlined">login</span> <span>Login</span>';
        }
      } catch (error) {
        console.error("Login error:", error);
        showAlert("alertMessage", error.message || "Login gagal", "error");
        loginBtn.disabled = false;
        loginBtn.innerHTML =
          '<span class="material-symbols-outlined">login</span> <span>Login</span>';
      }
    }

    // Show Alert Helper
    function showAlert(elementId, message, type = "info") {
      const alertDiv = document.getElementById("alert");
      const alertMessage = document.getElementById("alertMessage");

      alertMessage.textContent = message;

      // Remove old classes
      alertDiv.classList.remove("alert-success", "alert-error", "alert-info");

      // Add new class
      if (type === "success") {
        alertDiv.classList.add("alert-success");
      } else if (type === "error") {
        alertDiv.classList.add("alert-error");
      } else {
        alertDiv.classList.add("alert-info");
      }

      // Show alert
      alertDiv.classList.remove("hidden");

      // Auto hide after 5 seconds
      setTimeout(() => {
        alertDiv.classList.add("hidden");
      }, 5000);
    }

    // Check if already logged in
    window.addEventListener("load", () => {
      if (api.isLoggedIn()) {
        window.location.href = "./dashboard.html";
      }
    });

    // Auto-focus
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("email").focus();
    });
  </script>
</body>
</html>
